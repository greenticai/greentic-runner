[workspace]
members = [
    "crates/greentic-runner",
    "crates/greentic-runner-host",
    "crates/greentic-runner-desktop",
    "crates/greentic-aw-runtime",
    "crates/aw-event-bridge",
    "crates/telco-x-event-bridge",
    "crates/tests",
    "crates/runner-core",
    "tests/fixtures/packs/secrets_store_smoke/components",
    "tests/assets/component-v0-6-dummy",
]
resolver = "2"
exclude = [
    "tests/fixtures/oauth-broker-component",
    "tests/fixtures/component-echo",
    "tests/fixtures/runner-components",
    "tests/fixtures/wasi-p2-smoke",
    "tests/assets/provider-core-dummy",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "1.3.0-research.0"

[workspace.dependencies]
arc-swap = "1"
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
futures = "0.3"
greentic-flow = "=1.3.0-research.1"
greentic-session = "=1.3.0-research.1"
greentic-state = "=1.3.0-research.1"
greentic-config = "=1.3.0-research.1"
greentic-config-types = "=1.3.0-research.1"
greentic-secrets-lib = "=1.3.0-research.1"
greentic-trust = { git = "https://github.com/greenticai/greentic-trust", rev = "725fb4c" }
# Additive (from main): runner-host uses `greentic_deploy_spec::ids::{RevisionId,BundleId}`.
# Pinned to the research line so it unifies with greentic-start/greentic-deployer
# (which cross deploy-spec types with runner-host) instead of forking a 0.2.x copy.
greentic-deploy-spec = "=1.3.0-research.1"
hex = "0.4"
humantime = "2.1"
lru = "0.16"
once_cell = "1"
parking_lot = "0.12"
rand = "0.10"
serde_json = "1"
serde_cbor = "0.11"
sha2 = "0.11"
thiserror = "2.0"
tokio-util = "0.7"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
wasmparser = "0.246"
cron = "0.16"
url = "2"
indexmap = "2"
bytes = "1"
criterion = "0.8"
hmac = "0.13"
sha1 = "0.11"
blake3 = "1"
semver = "1"
tempfile = "3"
tiny_http = "0.12"
serial_test = "3"
toml = "1"
# Floor pinned to the C5.1 publish: `TelemetryCtx::kv()` must include
# `gt.pack_id` for the C5.4 export path; earlier dev publishes lack it.
greentic-telemetry = ">=1.1.0-0, <1.2.0-0"
walkdir = "2"
wasmtime-wasi-http = "45"
wasmtime-wasi-tls = "45"
jsonschema = "0.45"
handlebars = "6"
dashmap = "6"
proptest = "1"

[workspace.dependencies.axum]
version = "0.8"
features = [
    "macros",
    "json",
]

[workspace.dependencies.clap]
version = "4"
features = [
    "derive",
]

[workspace.dependencies.chrono]
version = "0.4"
default-features = false
features = [
    "clock",
]

[workspace.dependencies.ed25519-dalek]
version = "2"
features = [
    "pkcs8",
]

# Floor pinned to the M1.4b-ii publish (PR #134): adds
# `attr_keys::MESSAGING_ENDPOINT_ID` and the `tenant_ctx_to_telemetry` bridge
# mapping it onto `TelemetryCtx::messaging_endpoint_id`. Earlier dev publishes
# (incl. M1.1a) lack the const, so `tenant_ctx()` in
# `engine::runtime::IngressEnvelope` would fail to compile.
[workspace.dependencies.greentic-types]
version = "=1.3.0-research.1"
default-features = false
features = [
    "std",
    "serde",
    "time",
    "otel-keys",
]

[workspace.dependencies.greentic_pack]
package = "greentic-pack-lib"
version = "=1.3.0-research.2"

[workspace.dependencies.greentic-distributor-client]
version = "=1.3.0-research.1"
features = [
    "dist-client",
]

[workspace.dependencies.greentic-interfaces]
version = "=1.3.0-research.1"
default-features = false
features = [
    "bindings-rust",
]

[workspace.dependencies.greentic-interfaces-guest]
version = "=1.3.0-research.1"
default-features = false

[workspace.dependencies.greentic-interfaces-host]
version = "=1.3.0-research.1"

[workspace.dependencies.greentic-interfaces-wasmtime]
version = "=1.3.0-research.1"

[workspace.dependencies.greentic-x-runtime]
version = "0.4.20"

[workspace.dependencies.greentic-x-types]
version = "0.4.20"

[workspace.dependencies.greentic-oauth-sdk]
version = ">=1.1.0-0, <1.2.0-0"

[workspace.dependencies.greentic-oauth-host]
version = ">=1.1.0-0, <1.2.0-0"

[workspace.dependencies.greentic-runner-host]
path = "crates/greentic-runner-host"
version = "=1.3.0-research.0"

[workspace.dependencies.greentic-runner-desktop]
path = "crates/greentic-runner-desktop"
version = "=1.3.0-research.0"

[workspace.dependencies.runner-core]
path = "crates/runner-core"
version = "=1.3.0-research.0"

[workspace.dependencies.reqwest]
version = "0.13"
default-features = false
features = [
    "json",
    "rustls",
    "blocking",
]

[workspace.dependencies.rustls]
version = "0.23"
default-features = false
features = ["aws_lc_rs"]

[workspace.dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[workspace.dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[workspace.dependencies.time]
version = "0.3"
features = [
    "macros",
    "serde-well-known",
]

[workspace.dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "macros",
    "rt",
    "signal",
    "time",
    "net",
    "sync",
    "fs",
]

[workspace.dependencies.wit-bindgen]
version = "0.55"
default-features = false

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
]

[workspace.dependencies.zip]
version = "8"
default-features = false
features = [
    "deflate-flate2",
]

[workspace.dependencies.wasmtime]
version = "45"
default-features = false
features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
]

[workspace.dependencies.wasmtime-wasi]
version = "45"
default-features = false
features = [
    "p2",
]

[workspace.dependencies.wasmtime-environ]
version = "45"

[workspace.dependencies.insta]
version = "1"
features = [
    "json",
]

[profile.release.package.echo-secret]
opt-level = "z"
strip = true

# SDK 1.2.4-research is git-tagged only (the SDK repo's research line is
# intentionally not republished to crates.io). Redirect the crates.io
# requirement from greentic-ext-runtime v1.2.13-research onto the git
# tag so the workspace can adopt it without waiting on a registry release.
[patch.crates-io]
greentic-extension-sdk-contract = { git = "https://github.com/greenticai/greentic-designer-sdk.git", tag = "v1.3.0-research.5" }
# greentic-ext-runtime now anchors describe signatures to a TOFU publisher-key
# store, reusing sdk-registry's `TrustStore` rather than porting it. That pulls
# -registry (and its -state dep) into this graph; neither is on crates.io, so
# both need the same tag redirect as -contract above. Keep all three on ONE tag:
# they are `=`-pinned to each other, so a split resolves two crate instances.
greentic-extension-sdk-registry = { git = "https://github.com/greenticai/greentic-designer-sdk.git", tag = "v1.3.0-research.5" }
greentic-extension-sdk-state = { git = "https://github.com/greenticai/greentic-designer-sdk.git", tag = "v1.3.0-research.5" }

# `greentic-dw-operala-invoker` (and its sibling `*-llm` provider crates in
# greentic-dw) pin `greentic-llm` via a git tag (v1.2.6-research), while this
# workspace already depends on the same crate published to crates.io
# (=1.3.0-research.0, pulled transitively through greentic-aw-runtime's
# `greentic-llm-backend` feature and now also directly by greentic-runner-host
# for the in-process operala wiring). Without unifying the two, `Arc<dyn
# greentic_llm::LlmProvider>` built against the registry crate would not type-
# match `DeepWorkerInvoker::new`, which expects the git crate's trait object.
# Redirect the git source onto the registry release so both resolve to a
# single crate instance (reverse of the SDK/mcp-exec patches above).
[patch."https://github.com/greenticai/greentic-llm"]
greentic-llm = { version = "=1.3.1-research.0" }

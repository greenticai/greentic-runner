[workspace]
members = [
    "crates/greentic-runner",
    "crates/greentic-runner-host",
    "crates/greentic-runner-desktop",
    "crates/greentic-aw-runtime",
    "crates/aw-event-bridge",
    "crates/telco-x-event-bridge",
    "crates/tests",
    "crates/runner-core",
    "crates/greentic-a2a",
    "tests/fixtures/packs/secrets_store_smoke/components",
    "tests/assets/component-v0-6-dummy",
]
resolver = "2"
exclude = [
    "tests/fixtures/oauth-broker-component",
    "tests/fixtures/component-echo",
    "tests/fixtures/runner-components",
    "tests/fixtures/wasi-p2-smoke",
    "tests/assets/provider-core-dummy",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "1.2.0-dev.0"

# THE LANE. Every greentic dependency is a RANGE over the single `1.2.0-dev`
# crates.io lane (`>=1.2.0-dev, <1.3.0-0`), because `dev-publish.yml` stamps
# `1.2.0-dev.<RUN_ID>` on each push to develop and every repo in the chain has
# to resolve whatever its neighbours published last. Two deliberate exceptions:
# the designer-SDK crates track their own `1.2.24-dev` series, and
# greentic-ext-runtime publishes plain `1.2.<RUN_ID>` releases.
#
# There is no `[patch.crates-io]` section any more, and nothing here may name a
# git source: `cargo publish` refuses a dependency with a git source and no
# registry version, optional or not, so one git dep makes the whole workspace
# unpublishable.
[workspace.dependencies]
arc-swap = "1"
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
futures = "0.3"
greentic-flow = ">=1.2.0-dev, <1.3.0-0"
greentic-session = ">=1.2.0-dev, <1.3.0-0"
greentic-state = ">=1.2.0-dev, <1.3.0-0"
greentic-config = ">=1.2.0-dev, <1.3.0-0"
greentic-config-types = ">=1.2.0-dev, <1.3.0-0"
greentic-secrets-lib = ">=1.2.0-dev, <1.3.0-0"
greentic-trust = "0.2"
# Additive (from main): runner-host uses `greentic_deploy_spec::ids::{RevisionId,BundleId}`.
# The range is what unifies it with greentic-start/greentic-deployer, which
# cross deploy-spec types with runner-host: every repo in the chain resolves the
# same dev-lane publish instead of forking a copy of its own.
greentic-deploy-spec = ">=1.2.0-dev, <1.3.0-0"
hex = "0.4"
humantime = "2.1"
lru = "0.16"
once_cell = "1"
parking_lot = "0.12"
rand = "0.10"
serde_json = "1"
serde_cbor = "0.11"
sha2 = "0.11"
thiserror = "2.0"
tokio-util = "0.7"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
wasmparser = "0.246"
cron = "0.16"
url = "2"
indexmap = "2"
bytes = "1"
criterion = "0.8"
hmac = "0.13"
sha1 = "0.11"
blake3 = "1"
semver = "1"
tempfile = "3"
tiny_http = "0.12"
serial_test = "3"
toml = "1"
# `TelemetryCtx::kv()` must include `gt.pack_id` for the C5.4 export path; every
# 1.2 dev publish carries it (the floor it used to name was on the 1.1 line).
greentic-telemetry = ">=1.2.0-dev, <1.3.0-0"
walkdir = "2"
wasmtime-wasi-http = "45"
wasmtime-wasi-tls = "45"
jsonschema = "0.45"
handlebars = "6"
dashmap = "6"
proptest = "1"

[workspace.dependencies.axum]
version = "0.8"
features = [
    "macros",
    "json",
]

[workspace.dependencies.clap]
version = "4"
features = [
    "derive",
]

[workspace.dependencies.chrono]
version = "0.4"
default-features = false
features = [
    "clock",
]

[workspace.dependencies.ed25519-dalek]
version = "2"
features = [
    "pkcs8",
]

# Needs `attr_keys::MESSAGING_ENDPOINT_ID` and the `tenant_ctx_to_telemetry`
# bridge mapping it onto `TelemetryCtx::messaging_endpoint_id`; without them
# `tenant_ctx()` in `engine::runtime::IngressEnvelope` does not compile. Both
# are on the whole 1.2 dev lane.
[workspace.dependencies.greentic-types]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false
features = [
    "std",
    "serde",
    "time",
    "otel-keys",
]

[workspace.dependencies.greentic_pack]
package = "greentic-pack-lib"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-distributor-client]
version = ">=1.2.0-dev, <1.3.0-0"
features = [
    "dist-client",
]

[workspace.dependencies.greentic-interfaces]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false
features = [
    "bindings-rust",
]

[workspace.dependencies.greentic-interfaces-guest]
version = ">=1.2.0-dev, <1.3.0-0"
default-features = false

[workspace.dependencies.greentic-interfaces-host]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-interfaces-wasmtime]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-x-runtime]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-x-types]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-oauth-sdk]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-oauth-host]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-runner-host]
path = "crates/greentic-runner-host"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-runner-desktop]
path = "crates/greentic-runner-desktop"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.runner-core]
path = "crates/runner-core"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.reqwest]
version = "0.13"
default-features = false
features = [
    "json",
    "rustls",
    "blocking",
]

[workspace.dependencies.rustls]
version = "0.23"
default-features = false
features = ["aws_lc_rs"]

[workspace.dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[workspace.dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[workspace.dependencies.time]
version = "0.3"
features = [
    "macros",
    "serde-well-known",
]

[workspace.dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "macros",
    "rt",
    "signal",
    "time",
    "net",
    "sync",
    "fs",
]

[workspace.dependencies.wit-bindgen]
version = "0.55"
default-features = false

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
]

[workspace.dependencies.zip]
version = "8"
default-features = false
features = [
    "deflate-flate2",
]

[workspace.dependencies.wasmtime]
version = "45"
default-features = false
features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
]

[workspace.dependencies.wasmtime-wasi]
version = "45"
default-features = false
features = [
    "p2",
]

[workspace.dependencies.wasmtime-environ]
version = "45"

[workspace.dependencies.insta]
version = "1"
features = [
    "json",
]

[profile.release.package.echo-secret]
opt-level = "z"
strip = true

[package]
name = "greentic-runner-host"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Host runtime shim for Greentic runner: config, pack loading, activity handling"
homepage = "https://github.com/greentic-ai/greentic-runner"
repository = "https://github.com/greentic-ai/greentic-runner"
readme = "README.md"
keywords = ["greentic", "runner", "wasmtime", "mcp", "flows"]
categories = ["asynchronous", "api-bindings", "command-line-utilities"]

[features]
default = ["verify", "agentic-worker"]
verify = []
session-redis = ["greentic-session/redis"]
fault-injection = []
component-v0-6-introspection = []
# Declared but off by default. C5.4 introduced #[cfg(feature = "telemetry")]
# gates around greentic_telemetry::annotate_span calls; turning the gate on
# activates explicit span annotation (greentic-telemetry is always linked).
telemetry = []
greentic-x-provider = ["dep:greentic-x-runtime", "dep:greentic-x-types"]
# Gates the agentic-worker (DwAgent) node implementation and its deps
# (greentic-aw-runtime + greentic-ext-runtime). Disable this feature to
# produce a lean, publishable build that lacks DwAgent node support.
agentic-worker = ["dep:greentic-aw-runtime", "dep:greentic-ext-runtime"]
# Multi-provider in-process LLM backend for dw.agent (DeepSeek/Anthropic/…),
# routing the worker LLM call through greentic-llm. Opt-in (pulls rig-core).
greentic-llm-backend = ["agentic-worker", "greentic-aw-runtime?/greentic-llm-backend"]
# Adds the ephemeral (in-memory) agent builder for desktop/local runs.
# Enables the test-mock types from greentic-aw-runtime; must NOT be enabled
# in the server binary — the server always uses the Redis path.
desktop-agent-ephemeral = ["agentic-worker", "greentic-aw-runtime?/test-mock", "greentic-aw-runtime?/dev-allow-unsigned"]

[lints.rust]
# `long-term-chronicle` and `knowledge-chronicle` gate real in-tree modules
# (runner/long_term_memory.rs, runner/knowledge_mount.rs, runner/knowledge_corpus.rs)
# but are declared as features only on the `research` lane. Their optional deps
# (chronicle-core, chronicle-driver-{surreal,neo4j,falkor}) are git deps on the
# CROSS-ORG PRIVATE repo greentic-biz/greentic-chronicle-ext, and this lane's CI
# holds `greenticai`-org credentials only. Declaring them here would make cargo
# clone that repo during resolution — which happens regardless of whether the
# feature is switched on — and every `--all-features` build (Nightly Coverage,
# ci/local_check.sh) would die at dependency-fetch. So tell check-cfg the values
# are expected rather than declaring them, and keep the gated code compiling on
# `research` where the deps resolve. Re-declare as real features once a cross-org
# deploy key / PAT is provisioned. Mirrors the same allowlist on `develop`.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("knowledge-chronicle", "long-term-chronicle"))',
] }

[dependencies]
async-nats = "0.49"
async-trait.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
cron.workspace = true
greentic-aw-runtime = { path = "../greentic-aw-runtime", version = ">=1.1.0-0, <1.2.0-0", features = ["serve"], optional = true }
# Pulled only to enable its `pack-manifest-agents` feature (see the
# long-term-chronicle feature). The crate is otherwise a transitive dep of the
# openai-compatible providers above.
# Knowledge (document-RAG / W4) tier. The chronicle provider + its core trait/DTOs
# come from greentic-dw-providers; the SurrealDB driver + GraphDriver trait come
# from greentic-chronicle-ext and are built at this edge (bindgen / RocksDB live
# here). All optional, gated by the `knowledge-chronicle` feature.
greentic-ext-runtime = { version = "=1.2.26", optional = true }
greentic-flow.workspace = true
greentic-interfaces-host.workspace = true
greentic-interfaces-wasmtime.workspace = true
greentic-interfaces.workspace = true
greentic-x-runtime = { workspace = true, optional = true }
greentic-x-types = { workspace = true, optional = true }
greentic-types = { workspace = true, features = ["telemetry-autoinit"] }
greentic_pack.workspace = true
greentic-distributor-client.workspace = true
greentic-deploy-spec.workspace = true
greentic-session.workspace = true
greentic-state.workspace = true
greentic-secrets-lib.workspace = true
greentic-config.workspace = true
greentic-config-types.workspace = true
hex.workspace = true
humantime.workspace = true
indexmap.workspace = true
lru.workspace = true
opentelemetry = "0.31"
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
runner-core.workspace = true
serde = { workspace = true }
serde_cbor.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
time.workspace = true
tracing.workspace = true
url.workspace = true
wasmparser.workspace = true
zip.workspace = true
bytes.workspace = true
futures.workspace = true
hmac.workspace = true
sha1.workspace = true
blake3.workspace = true
once_cell.workspace = true
tempfile.workspace = true
handlebars.workspace = true
dashmap.workspace = true
wasmtime-environ.workspace = true
jsonschema.workspace = true
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "mysql",
    "chrono",
    "json",
] }
subtle = "2"

# External stack components
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
wasmtime-wasi-tls = { workspace = true }
greentic-telemetry = { workspace = true }

[dev-dependencies]
criterion.workspace = true
serial_test.workspace = true
tempfile.workspace = true
once_cell.workspace = true
semver.workspace = true
proptest.workspace = true
# C5.4 export regression: a real OTLP exporter to prove gt.* attribution reaches
# exported spans. Versions match greentic-telemetry's OTel stack.
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tower.workspace = true
http-body-util = "0.1"
wiremock = "0.6"
greentic-aw-runtime = { path = "../greentic-aw-runtime", version = ">=1.1.0-0, <1.2.0-0", features = ["test-mock"] }

[[bench]]
name = "perf"
harness = false

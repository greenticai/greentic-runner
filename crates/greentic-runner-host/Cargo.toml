[package]
name = "greentic-runner-host"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Host runtime shim for Greentic runner: config, pack loading, activity handling"
homepage = "https://github.com/greentic-ai/greentic-runner"
repository = "https://github.com/greentic-ai/greentic-runner"
readme = "README.md"
keywords = ["greentic", "runner", "wasmtime", "mcp", "flows"]
categories = ["asynchronous", "api-bindings", "command-line-utilities"]

[features]
default = ["verify", "agentic-worker"]
verify = []
# Restored on develop once every crate in the chain had a publish whose
# `greentic-types` requirement fits this lane's `>=1.2.0-dev, <1.3.0-0`.
# Carries the MCP flow-node runtime: without it `execute_mcp` is a stub that
# returns Ok with an `{error: …}` payload, so an MCP node reports success
# while doing nothing.
agentic-worker = ["dep:greentic-aw-runtime", "dep:greentic-ext-runtime"]
session-redis = ["greentic-session/redis"]
fault-injection = []
component-v0-6-introspection = []
# Declared but off by default. C5.4 introduced #[cfg(feature = "telemetry")]
# gates around greentic_telemetry::annotate_span calls; turning the gate on
# activates explicit span annotation (greentic-telemetry is always linked).
telemetry = []
greentic-x-provider = ["dep:greentic-x-runtime", "dep:greentic-x-types"]
# Multi-provider in-process LLM backend for dw.agent (DeepSeek/Anthropic/…),
# routing the worker LLM call through greentic-llm. Opt-in (pulls rig-core).
#
# Restored on develop: the declaration was dropped in d43ae4dd as main-only
# wiring, which left `agent_node.rs`'s `#[cfg(feature = "greentic-llm-backend")]`
# block permanently false. Every published binary therefore routed EVERY dw.agent
# LLM call to api.openai.com regardless of the agent's configured `llm.provider`,
# with nothing reporting it. Off by default, exactly as on main.
greentic-llm-backend = [
    "agentic-worker",
    "dep:greentic-llm",
    "greentic-aw-runtime?/greentic-llm-backend",
]
# Adds the ephemeral (in-memory) agent builder for desktop/local runs, so a
# single-process runner serves dw.agent turns with no Redis. Enables the
# test-mock types from greentic-aw-runtime; must NOT be enabled in the server
# binary — the server always uses the Redis path.
#
# Restored on develop for the same reason as `greentic-llm-backend` above:
# without it `runtime.rs`'s no-Redis branch falls through to the Redis builder
# and `dw.agent` nodes are silently disabled when GREENTIC_AW_REDIS_URL is unset.
desktop-agent-ephemeral = [
    "agentic-worker",
    "greentic-aw-runtime?/test-mock",
    "greentic-aw-runtime?/dev-allow-unsigned",
]

# `agentic-worker`, `greentic-llm-backend` and `desktop-agent-ephemeral` are all
# real features again (see above). These two remain research-only: the source
# still carries `#[cfg(feature = "…")]` gates for them but their backing crates
# (chronicle-*) are git deps on a cross-org private repo this lane holds no
# credentials for, so the gated code stays dead. Tell check-cfg the values are
# expected so `-D warnings` (unexpected_cfgs) does not fire. Re-declare as real
# features when their wiring is restored too.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("knowledge-chronicle", "long-term-chronicle"))',
    # Not a cargo feature on purpose: CI builds with `--all-features`, which
    # would switch a feature on and break the build. Parks the conversational
    # `dw.agent` park-loop test harness until this lane's engine grows the
    # branch it exercises. Compile it with
    # `RUSTFLAGS="--cfg conversational_dw_agent_port"`.
    'cfg(conversational_dw_agent_port)',
    # Mirrors greentic-aw-runtime's parked gate: selects the WASM-backed
    # guardrail evaluator over the fail-closed stand-in. Same reason it is not
    # a feature — CI builds `--all-features`.
    'cfg(greentic_guardrail_ext)',
    # Mirrors greentic-aw-runtime's parked gate: without `extension_tools` on
    # `DigitalWorkerManifest` the tool overlay is always empty, so the test
    # that asserts it applies is parked and its counterpart pins the silence.
    'cfg(greentic_dw_manifest_tools)',
] }


[dependencies]
greentic-aw-runtime = { path = "../greentic-aw-runtime", version = ">=1.2.0-dev, <1.3.0-0", features = ["serve"], optional = true }
greentic-ext-runtime = { version = "=1.2.34077794832", optional = true }
# Only for `ProviderKind::requires_api_key()`, which decides whether an empty
# API key is acceptable for the configured provider (Ollama / Llamafile /
# Bedrock are keyless). Pinned to the exact version greentic-aw-runtime already
# resolves, so both crates share one instance. Optional: without the
# `greentic-llm-backend` feature the multi-provider backend is not compiled in
# at all and `agent_node`'s local keyless table is used instead.
greentic-llm = { version = "=1.3.1-research.0", optional = true }
async-nats = "0.49"
async-trait.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
cron.workspace = true
greentic-flow.workspace = true
greentic-interfaces-host.workspace = true
greentic-interfaces-wasmtime.workspace = true
greentic-interfaces.workspace = true
greentic-x-runtime = { workspace = true, optional = true }
greentic-x-types = { workspace = true, optional = true }
greentic-types = { workspace = true, features = ["telemetry-autoinit"] }
greentic_pack.workspace = true
greentic-distributor-client.workspace = true
greentic-deploy-spec.workspace = true
greentic-session.workspace = true
greentic-state.workspace = true
greentic-secrets-lib.workspace = true
greentic-config.workspace = true
greentic-config-types.workspace = true
hex.workspace = true
humantime.workspace = true
indexmap.workspace = true
lru.workspace = true
opentelemetry = "0.31"
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
runner-core.workspace = true
serde = { workspace = true }
serde_cbor.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
time.workspace = true
tracing.workspace = true
url.workspace = true
wasmparser.workspace = true
zip.workspace = true
bytes.workspace = true
futures.workspace = true
hmac.workspace = true
sha1.workspace = true
blake3.workspace = true
once_cell.workspace = true
tempfile.workspace = true
handlebars.workspace = true
dashmap.workspace = true
wasmtime-environ.workspace = true
jsonschema.workspace = true
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "mysql",
    "chrono",
    "json",
] }
subtle = "2"

# External stack components
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
wasmtime-wasi-tls = { workspace = true }
greentic-telemetry = { workspace = true }

[dev-dependencies]
# `test-mock` supplies `greentic_aw_runtime::mock` and `cost::MockTokenMeter`,
# which the agent-node tests import. A dev-dep, so published builds never
# carry it.
greentic-aw-runtime = { path = "../greentic-aw-runtime", version = ">=1.2.0-dev, <1.3.0-0", features = ["test-mock"] }
criterion.workspace = true
serial_test.workspace = true
tempfile.workspace = true
once_cell.workspace = true
semver.workspace = true
proptest.workspace = true
# C5.4 export regression: a real OTLP exporter to prove gt.* attribution reaches
# exported spans. Versions match greentic-telemetry's OTel stack.
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tower.workspace = true
http-body-util = "0.1"
wiremock = "0.6"

[[bench]]
name = "perf"
harness = false

[package]
name = "greentic-runner"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Greentic runner binaries and re-exported host/new-runner APIs"
homepage = "https://github.com/greentic-ai/greentic-runner"
repository = "https://github.com/greentic-ai/greentic-runner"
documentation = "https://docs.rs/greentic-runner"
readme = "../../README.md"
keywords = ["greentic", "agent", "runner", "wasm", "mcp"]
categories = ["wasm", "command-line-utilities", "network-programming"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
clap.workspace = true
# NOT `workspace = true`: Cargo/edition-2024 forbids a member from overriding
# `default-features` on a workspace-inherited dependency unless the workspace
# declaration itself already says `default-features = false` — and flipping it
# there would cascade to every other workspace member that depends on these
# crates (crates/tests, aw-event-bridge, telco-x-event-bridge), pulling their
# `agentic-worker`/`state-disk` defaults out from under them too. Writing the
# path+version out explicitly here (instead of inheriting) keeps the
# `default-features = false` scoped to just this runner->host / runner->desktop
# edge, so a lean `--no-default-features --features verify` build of
# `greentic-runner` produces a coherent (agentic-worker-OFF) feature graph
# without touching any other member's defaults. See the `agentic-worker`
# feature below, which re-forwards it for the default build.
greentic-runner-host = { path = "../greentic-runner-host", version = "=1.3.0-research.0", default-features = false }
greentic-runner-desktop = { path = "../greentic-runner-desktop", version = "=1.3.0-research.0", default-features = false }
greentic-interfaces.workspace = true
greentic-interfaces-host.workspace = true
greentic-interfaces-wasmtime.workspace = true
greentic-types = { workspace = true, features = ["telemetry-autoinit"] }
greentic-config.workspace = true
greentic-distributor-client.workspace = true
greentic_pack.workspace = true
wasmtime-environ.workspace = true
humantime.workspace = true
runner-core = { workspace = true }
chrono.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
serde_json.workspace = true
serde_cbor.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_yaml_bw.workspace = true
serde.workspace = true
sha2.workspace = true
wasmparser.workspace = true
url.workspace = true
indexmap.workspace = true
toml.workspace = true
zip.workspace = true
tempfile.workspace = true
walkdir.workspace = true

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# Passthrough feature flags so the `info` report can accurately partition host
# capabilities into enabled/disabled. These stay disabled by default — enable
# them on the host crate and mirror them here if you need them surfaced.
default = ["verify", "agentic-worker"]
verify = ["greentic-runner-host/verify"]
telemetry = ["greentic-runner-host/telemetry"]
session-redis = ["greentic-runner-host/session-redis"]
component-v0-6-introspection = ["greentic-runner-host/component-v0-6-introspection"]
fault-injection = ["greentic-runner-host/fault-injection"]
legacy-gen-bindings = []
# Operator-configured Chronicle document-RAG (knowledge tier). Off by default
# (pulls cross-org git deps + a native RocksDB build); enable for a knowledge
# build: `--features knowledge-chronicle`.
knowledge-chronicle = ["greentic-runner-host/knowledge-chronicle"]
# Long-term episodic memory tier (same Chronicle stack, separate capability).
long-term-chronicle = ["greentic-runner-host/long-term-chronicle"]
# No-infra agentic-worker state: process-global in-memory stores when
# GREENTIC_AW_REDIS_URL is unset, so a single-process runner runs dw.agent turns
# without Redis. For local/sidecar use (e.g. the designer's loopback test-chat
# runner sidecar) — NOT production deploys (use the Redis-backed stores). Off by default.
desktop-agent-ephemeral = ["greentic-runner-host/desktop-agent-ephemeral"]
# Skips extension signature verification when GREENTIC_EXT_ALLOW_UNSIGNED=1.
# LOCAL DEV ONLY — never in a build that serves production traffic. Split out of
# desktop-agent-ephemeral so the bypass has to be asked for by name.
dev-allow-unsigned = ["greentic-runner-host/dev-allow-unsigned"]
# Gates DwAgent (agentic-worker) nodes and their unpublishable runtime deps.
# Enabled by default for local workspace builds; excluded from published
# defaults because greentic-aw-runtime is not on crates.io.
agentic-worker = [
    "greentic-runner-host/agentic-worker",
    "greentic-runner-host/state-disk",
    "greentic-runner-desktop/agentic-worker",
]
# Multi-provider in-process LLM backend for dw.agent (DeepSeek/Anthropic/…) via
# greentic-llm. Passthrough to the host/desktop crates. Opt-in (pulls rig-core);
# `gtc`/greentic-start must add this to its runner feature list to surface it.
greentic-llm-backend = [
    "greentic-runner-host/greentic-llm-backend",
    "greentic-runner-desktop/greentic-llm-backend",
]

[dev-dependencies]
greentic-flow.workspace = true
greentic-config-types.workspace = true
serial_test.workspace = true
semver.workspace = true
insta.workspace = true
greentic-state.workspace = true

[lib]
name = "greentic_runner"
path = "src/lib.rs"

[[bin]]
name = "greentic-runner"
path = "src/main.rs"

[[bin]]
name = "greentic-gen-bindings"
path = "src/bin/gen_bindings.rs"
required-features = ["legacy-gen-bindings"]

[[bin]]
name = "greentic-runner-cli"
path = "src/bin/greentic-runner-cli.rs"
required-features = ["legacy-gen-bindings"]

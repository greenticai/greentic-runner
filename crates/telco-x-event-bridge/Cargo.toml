[package]
name        = "telco-x-event-bridge"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
description = "NATS event bridge for a Telco-X runtime: consumes greentic.telco-x.request.v1 and dispatches to a TelcoXDispatchInvoker."
publish     = false

[dependencies]
anyhow         = { workspace = true }
async-nats     = "0.46"
async-trait    = { workspace = true }
futures-util   = "0.3"
greentic-types = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal"] }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
async-trait    = { workspace = true }
bytes          = "1"
futures-util   = "0.3"
greentic-types = { workspace = true }
serde_json     = { workspace = true }
tokio          = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

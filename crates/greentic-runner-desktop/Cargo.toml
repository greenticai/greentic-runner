[package]
name = "greentic-runner-desktop"
version.workspace = true
edition.workspace = true
description = "Developer desktop runner harness for Greentic packs"
license = "MIT"
homepage = "https://github.com/greentic-ai/greentic-runner"
repository = "https://github.com/greentic-ai/greentic-runner"

[features]
default = ["agentic-worker"]
# Propagates the agentic-worker feature to the host shim.
# Keep out of published defaults when greentic-aw-runtime is not on crates.io.
agentic-worker = ["greentic-runner-host/agentic-worker", "greentic-runner-host/state-disk"]
# Multi-provider in-process LLM backend (DeepSeek/Anthropic/…) via greentic-llm.
greentic-llm-backend = ["agentic-worker", "greentic-runner-host/greentic-llm-backend"]
# Enables the ephemeral (in-memory) agent state store for desktop/local runs.
# Activates test-mock types from greentic-aw-runtime; must NOT be in `default`
# so the server build (agentic-worker only) never compiles the mocks.
desktop-agent-ephemeral = ["agentic-worker", "greentic-runner-host/desktop-agent-ephemeral"]
# See greentic-runner-host. LOCAL DEV ONLY.
dev-allow-unsigned = ["agentic-worker", "greentic-runner-host/dev-allow-unsigned"]

[dependencies]
anyhow.workspace = true
# NOT `workspace = true`: see the matching comment in
# crates/greentic-runner/Cargo.toml. This crate's own `build_host_config`
# (src/lib.rs) cfg-gates `HostConfig.agents`/`.graphs` on ITS OWN
# `agentic-worker` feature, so that feature must be the sole thing turning
# host's `agentic-worker` on for this crate too — otherwise a standalone
# `--no-default-features` build of this crate (e.g. the workspace-wide lean
# clippy gate) pulls host's `agentic-worker` default back on while this
# crate's own gate stays off, reproducing the same E0063 incoherence.
greentic-runner-host = { path = "../greentic-runner-host", version = "=1.3.0-research.0", default-features = false, features = ["telemetry"] }
greentic_pack.workspace = true
parking_lot.workspace = true
runner-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
async-trait.workspace = true
greentic-secrets-lib.workspace = true
greentic-types.workspace = true
once_cell.workspace = true
semver.workspace = true
serial_test.workspace = true
tempfile.workspace = true

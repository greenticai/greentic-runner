# Research-channel crates.io publish workflow.
#
# Versions come straight from Cargo.toml [workspace.package] version and MUST
# follow the pattern X.Y.Z-research (e.g. 1.2.0-research). crates.io treats
# any pre-release as a lower sort priority than stable, so research builds
# never shadow a stable release.
#
# Re-publishing the SAME version will be rejected by crates.io ("already
# exists"). Bump the version in Cargo.toml before re-running (e.g.
# 1.2.0-research → 1.2.1-research).
#
# Trigger: push to `research` (or manual Actions → Research Publish → Run workflow).
# Maintainer prerequisites:
#   1. Add CARGO_REGISTRY_TOKEN as a repository (or organisation) secret.
#   2. Ensure the version in Cargo.toml is X.Y.Z-research before running.
#   3. Run from the `research` branch — the job guard rejects other refs.

name: Research Publish

on:
  # Publishes on push to `research`. The "Strip unpublishable internal deps"
  # step below removes greentic-aw-runtime / greentic-ext-runtime + the
  # agentic-worker feature before `cargo publish`, replicating what the org
  # `dev-prepare` does — validated via `cargo publish --dry-run` (host packages
  # cleanly as X.Y.Z-research). Per-crate warn-continue makes re-pushes safe;
  # bump the -research version in Cargo.toml to publish a new one.
  push:
    branches: [research]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish research crates to crates.io
    runs-on: ubuntu-latest

    # Guard: only run on the research branch.
    if: github.ref == 'refs/heads/research'

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      # Mirror the exact toolchain used by ci.yml heavy_wasm job.
      # wasm32-wasip2 is added so crates that compile WASM fixtures during
      # their build scripts (or doc-tests) do not fail to resolve the target.
      - name: Install Rust toolchain (1.95.0 + wasm32-wasip2)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2

      - name: Add wasm32-wasip2 target (belt-and-suspenders)
        run: rustup target add wasm32-wasip2 --toolchain 1.95.0

      - name: Set up Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Fail fast: the workspace version must be a -research prerelease.
      # This prevents accidentally publishing a stable or -dev version via
      # this workflow.
      - name: Verify workspace version is a -research prerelease
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "workspace version: $VER"
          [[ "$VER" =~ -research(\.[0-9A-Za-z-]+)*$ ]] || {
            echo "::error::research-publish expects a -research prerelease version; got '$VER'. Bump Cargo.toml version to X.Y.Z-research and retry."
            exit 1
          }

      # Strip unpublishable internal deps before publishing.
      #
      # greentic-aw-runtime (private git deps on this branch) and greentic-ext-runtime (private git)
      # are feature-gated behind the `agentic-worker` feature in greentic-runner-host,
      # greentic-runner-desktop, and greentic-runner. crates.io rejects any manifest
      # that references a git source or an unpublished path dep, even optional ones.
      #
      # This step replicates what the org-level `dev-prepare` workflow does:
      # it removes the two dep entries and the `agentic-worker` feature declaration
      # (including its removal from `default`) from the three affected Cargo.toml
      # files. The cfg(feature="agentic-worker") code is then dead-excluded, so the
      # crates compile and publish without those deps. The strip is CI-ephemeral and
      # is never committed back to the branch.
      #
      # The script is idempotent (no-op if already stripped) and uses tomlkit for
      # structure-preserving TOML edits (no regex hacks).
      - name: Strip unpublishable internal deps (aw-runtime / ext-runtime)
        run: |
          pip install --quiet tomlkit
          python3 - <<'PYEOF'
          import tomlkit, pathlib, sys

          WORKSPACE_ROOT    = pathlib.Path(".")
          UNPUBLISHABLE_DEPS  = {"greentic-aw-runtime", "greentic-ext-runtime"}
          UNPUBLISHABLE_FEATS = {"agentic-worker"}

          # Only crates that directly reference the deps or propagate the feature.
          TARGET_CRATES = [
              "crates/greentic-runner-host",
              "crates/greentic-runner-desktop",
              "crates/greentic-runner",
          ]

          def strip_manifest(manifest_path: pathlib.Path) -> bool:
              """Remove unpublishable dep entries and the agentic-worker feature.
              Returns True if the file was modified."""
              text = manifest_path.read_text()
              doc  = tomlkit.loads(text)
              changed = False

              # Remove from [dependencies] and [dev-dependencies]
              for section in ("dependencies", "dev-dependencies"):
                  if section in doc:
                      for dep_name in list(UNPUBLISHABLE_DEPS):
                          if dep_name in doc[section]:
                              del doc[section][dep_name]
                              print(f"  [{section}] removed {dep_name!r}")
                              changed = True

              # Remove feature declarations and scrub from default list
              if "features" in doc:
                  feats = doc["features"]
                  for feat_name in list(UNPUBLISHABLE_FEATS):
                      if feat_name in feats:
                          del feats[feat_name]
                          print(f"  [features] removed {feat_name!r}")
                          changed = True

                  if "default" in feats:
                      original_defaults = list(feats["default"])
                      new_defaults      = [v for v in original_defaults if v not in UNPUBLISHABLE_FEATS]
                      if new_defaults != original_defaults:
                          rebuilt = tomlkit.array()
                          for val in new_defaults:
                              rebuilt.append(val)
                          feats["default"] = rebuilt
                          print(f"  [features.default] {original_defaults!r} -> {new_defaults!r}")
                          changed = True

              if changed:
                  manifest_path.write_text(tomlkit.dumps(doc))
              return changed

          any_changed = False
          for crate_rel in TARGET_CRATES:
              manifest_path = WORKSPACE_ROOT / crate_rel / "Cargo.toml"
              print(f"Checking {crate_rel}/Cargo.toml ...")
              if strip_manifest(manifest_path):
                  any_changed = True
                  print(f"  => stripped")
              else:
                  print(f"  => no-op (already clean)")

          print(f"\nStrip complete. {'Manifests modified.' if any_changed else 'No changes needed.'}")
          PYEOF

      # Publish in dependency order (runner-core → greentic-runner-host →
      # greentic-runner-desktop → greentic-runner).
      #
      # Crates deliberately NOT in this list:
      #   - crates/tests, crates/telco-x-event-bridge  (publish = false)
      #   - greentic-aw-runtime, aw-event-bridge, greentic-a2a: these have no
      #     `publish = false`, and the develop/main lanes (dev-publish.yml,
      #     crates-publish.yml, release-binaries.yml) publish them. On this
      #     branch greentic-aw-runtime carries private git dependencies, which
      #     crates.io rejects, so the strip step above removes the
      #     `agentic-worker` feature from the three crates below instead.
      #
      # --allow-dirty is required because the strip step above modifies Cargo.toml
      # files in-place without committing (CI-ephemeral operation).
      #
      # Re-publishing an existing version returns "already exists", which is
      # tolerated so a partial run can be re-triggered. Any other failure
      # (auth, verification, a dependency issue) fails the job: continuing
      # would publish dependents against a stale dependency.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          published=()
          skipped=()
          log="$(mktemp)"

          for crate in runner-core greentic-runner-host greentic-runner-desktop greentic-runner; do
            echo "==> publishing $crate"
            if cargo publish -p "$crate" --allow-dirty --token "$CARGO_REGISTRY_TOKEN" 2>&1 | tee "$log"; then
              published+=("$crate")
              echo "::notice::$crate published successfully"
            elif grep -qiE 'already (exists|uploaded)' "$log"; then
              skipped+=("$crate")
              echo "::notice::$crate already published at this version; continuing"
            else
              echo "::error::publish of $crate failed (not an 'already exists' error)"
              echo "Published : ${published[*]:-none}"
              echo "Skipped   : ${skipped[*]:-none}"
              exit 1
            fi
            # Give the crates.io index time to ingest the new crate before the
            # next dependent crate tries to resolve it.
            sleep 20
          done

          echo ""
          echo "===== Publish summary ====="
          echo "Published : ${published[*]:-none}"
          echo "Skipped   : ${skipped[*]:-none}"

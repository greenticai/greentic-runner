name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: greenticai/.github/.github/workflows/release-binaries.yml@main
    with:
      package: greentic-runner
      binary: greentic-runner
      windows-archive-format: zip
      extra-files: |
        README.md
        LICENSE
    secrets: inherit

  publish_crates:
    name: Publish to crates.io
    needs: [release]
    permissions:
      contents: read
    uses: greenticai/.github/.github/workflows/crates-publish.yml@main
    with:
      # Must match crates-publish.yml and stay in dependency order: a crate is
      # verified against its dependencies as resolved from crates.io (cargo
      # strips `path` when packaging), so every workspace sibling a later crate
      # depends on has to be published earlier in this same list. Omitting
      # greentic-aw-runtime made greentic-runner-host verify against whatever
      # older aw-runtime was already on crates.io, which breaks the moment a
      # release has runner-host calling a newly added aw-runtime API (v1.1.10:
      # `TenantContext::with_project_id` -> E0599, partial release).
      crates: "runner-core greentic-a2a aw-event-bridge greentic-aw-runtime greentic-runner-host greentic-runner-desktop greentic-runner"
    secrets: inherit

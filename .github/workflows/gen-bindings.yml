name: Bindings generator
permissions:
  contents: read

# NOTE: no `pull_request:` trigger. This job runs `cargo test --package
# greentic-runner`, which resolves the whole workspace; cargo then cloned the
# cross-org private repo `greentic-biz/greentic-chronicle-ext` (the optional
# `knowledge-chronicle` deps) during resolution, and PR CI lacks cross-org
# credentials, so it always failed at dependency-fetch — pure red noise on every
# PR. That reason is GONE: the Chronicle backends moved out behind
# `runner::runtime_ext` and no private git dependency is left. Restoring the
# `pull_request:` trigger is a separate change (it has not been run on a PR
# since, so nobody knows what else it reports).
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run generator tests
        run: cargo test --package greentic-runner --test gen_bindings

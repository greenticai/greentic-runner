name: Nightly Coverage

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-policy:
    name: Coverage Policy
    runs-on: ubuntu-latest
    env:
      CI: "1"
      CARGO_NET_OFFLINE: "false"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2

      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2 --toolchain 1.95.0

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview --toolchain 1.95.0

      - uses: cargo-bins/cargo-binstall@main

      - name: Install coverage tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--disable-strategies compile` makes a failed prebuilt-binary lookup a hard
        # error instead of a silent fallback. Without it, a 403 from api.github.com
        # (anonymous rate limit or a transient) does not fail binstall — it degrades to
        # `cargo install <tool>` without `--locked`, and cargo-nextest has a deliberate
        # compile_error! rejecting exactly that, so the job spends ~11 minutes compiling
        # and then exits 70 looking like a Rust build break. All three tools publish
        # prebuilt binaries, so disabling the compile strategy costs nothing.
        run: |
          cargo binstall --no-confirm --disable-strategies compile greentic-dev cargo-nextest cargo-llvm-cov wasm-tools
          command -v greentic-dev
          command -v cargo-nextest
          command -v cargo-llvm-cov
          command -v wasm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Validate coverage policy
        run: greentic-dev coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-artifacts
          path: |
            target/coverage
            coverage-policy.json
          if-no-files-found: ignore
